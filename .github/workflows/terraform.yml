name: Terraform CI/CD

on:
  push:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Plan and Apply
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: eu-central-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

      # ---------------------------------------------------------------
      # Despliegue de las apps de Kubernetes
      # ---------------------------------------------------------------

      - name: Deploy backend to eks-backend
        run: |
          aws eks update-kubeconfig --name eks-backend --region $AWS_REGION
          kubectl apply --dry-run=client -f kubernetes/backend.yaml
          kubectl apply -f kubernetes/backend.yaml
          kubectl rollout status deployment/backend --timeout=180s

      - name: Wait for backend internal Load Balancer
        id: backend-lb
        run: |
          aws eks update-kubeconfig --name eks-backend --region $AWS_REGION
          for i in $(seq 1 30); do
            HOST=$(kubectl get svc backend-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$HOST" ]; then
              echo "endpoint=$HOST" >> "$GITHUB_OUTPUT"
              echo "Backend LB listo: $HOST"
              exit 0
            fi
            echo "Esperando NLB interno del backend... ($i/30)"
            sleep 20
          done
          echo "Timeout esperando el NLB del backend" >&2
          exit 1

      - name: Deploy proxy to eks-gateway
        run: |
          aws eks update-kubeconfig --name eks-gateway --region $AWS_REGION
          sed "s|BACKEND_ENDPOINT_PLACEHOLDER|${{ steps.backend-lb.outputs.endpoint }}|g" \
            kubernetes/proxy.yaml > /tmp/proxy-final.yaml
          kubectl apply --dry-run=client -f /tmp/proxy-final.yaml
          kubectl apply -f /tmp/proxy-final.yaml
          kubectl rollout status deployment/proxy --timeout=180s

      - name: Wait for public Load Balancer and verify end-to-end
        run: |
          aws eks update-kubeconfig --name eks-gateway --region $AWS_REGION
          for i in $(seq 1 30); do
            HOST=$(kubectl get svc proxy-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$HOST" ]; then
              echo "Proxy LB listo: $HOST"
              sleep 30
              curl -sf "http://$HOST" && echo "OK: el proxy alcanzo el backend" && exit 0
            fi
            echo "Esperando NLB publico del gateway... ($i/30)"
            sleep 20
          done
          echo "Timeout validando el flujo end-to-end" >&2
          exit 1
